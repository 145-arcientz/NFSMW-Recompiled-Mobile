
name: Build NFSMW APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew || {
            echo "ERROR: gradlew tidak ditemukan di root repository."
            exit 1
          }
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -path "*/build/outputs/apk/*" \
            -name "*.apk" -print
          if ! find . -type f -path "*/build/outputs/apk/*" \
            -name "*.apk" -print -quit | grep -q .; then
            echo "ERROR: Build selesai tanpa menghasilkan APK."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Mod-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7
