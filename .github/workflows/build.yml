
name: Build NFSMW APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfsmw-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: "25.2.9519653"
      ANDROID_CMAKE_VERSION: "3.22.1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project structure..."

          if [ ! -f gradlew ]; then
            echo "::error::gradlew tidak ditemukan di root repository."
            exit 1
          fi

          if [ ! -f settings.gradle ] &&
             [ ! -f settings.gradle.kts ] &&
             [ ! -f build.gradle ] &&
             [ ! -f build.gradle.kts ]; then
            echo "::error::File konfigurasi Gradle tidak ditemukan."
            exit 1
          fi

          chmod +x gradlew

          echo "Project files:"
          find . -maxdepth 3 \
            \( -name build.gradle -o \
               -name build.gradle.kts -o \
               -name settings.gradle -o \
               -name settings.gradle.kts -o \
               -name gradle-wrapper.properties -o \
               -name libs.versions.toml \) \
            -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            || {
              echo "::error::Gagal memproses lisensi Android SDK."
              exit 1
            }

      - name: Install Android platforms
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --install \
            "platforms;android-30" \
            "platforms;android-31" \
            "platforms;android-32" \
            "platforms;android-33" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Report toolchain versions
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

          echo "Android SDK: $ANDROID_HOME"
          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms"

          echo "Installed NDK:"
          ls "$ANDROID_HOME/ndk"

      - name: Check Gradle wrapper configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          if ! grep -q 'distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties; then
            echo "::error::distributionUrl Gradle tidak ditemukan."
            exit 1
          fi

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease 2>&1 | tee build.log

      - name: Verify APK output
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-apk

          count=0

          while IFS= read -r -d '' apk; do
            name="$(basename "$apk")"
            cp "$apk" "release-apk/$name"
            echo "Found APK: $apk"
            count=$((count + 1))
          done < <(
            find . -type f \
              -path "*/build/outputs/apk/*" \
              -name "*.apk" \
              -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "::error::Build sukses tetapi APK tidak ditemukan."
            exit 1
          fi

          echo "Verified $count APK file(s)."
          ls -lh release-apk/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Mod-APK
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
