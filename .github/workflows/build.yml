
name: Build NFSMW APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Accept Android licenses
        run: |
          set -o pipefail
          yes | sdkmanager --licenses || {
            echo "License acceptance failed"
            exit 1
          }

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          if [ -f android/gradlew ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          elif [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: gradlew tidak ditemukan di root atau folder android/"
            find . -maxdepth 3 -name gradlew -print
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
