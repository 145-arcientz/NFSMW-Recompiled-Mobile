
name: Build NFSMW APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfsmw-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: "25.2.9519653"
      ANDROID_CMAKE_VERSION: "3.22.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Searching for Gradle wrapper..."

          GRADLEW="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            -name gradlew \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan."
            echo "Repository structure:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
              | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Konfigurasi proyek Gradle tidak ditemukan."
            exit 1
          fi

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"
          echo "Gradle wrapper configuration:"
          cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
          with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "platforms;android-31" \
            "platforms;android-32" \
            "platforms;android-33" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Report build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          cd "$PROJECT_DIR"
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release-apk"

          count=0

          while IFS= read -r -d '' apk; do
            relative="${apk#"$PROJECT_DIR"/}"
            safe_name="$(echo "$relative" | tr '/' '_')"

            cp "$apk" "$GITHUB_WORKSPACE/release-apk/$safe_name"
            echo "APK found: $relative"
            count=$((count + 1))
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*.apk" \
              -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "::error::Build selesai tetapi APK tidak ditemukan."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/release-apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Mod-APK
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
