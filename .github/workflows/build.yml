name: Build NFSMW APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "tools/android/requirements.txt" ]; then pip install -r tools/android/requirements.txt; fi

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev

      - name: Generate C++ Source Code (Wajib)
        run: |
          if [ -f "assets/game_root/default.xex" ]; then
            echo "File default.xex ditemukan. Memulai generasi kode C++..."
            python tools/android/preparar_sdk.py
            python tools/android/generar_codigo.py
          else
            echo "ERROR FATAL: File assets/game_root/default.xex tidak ditemukan!"
            exit 1
          fi

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
