
name: Build NFSMW Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfsmw-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew tidak ditemukan."
            find . -maxdepth 4 -name gradlew -type f
            exit 1
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle wrapper configuration tidak ditemukan."
            exit 1
          fi

          chmod +x android/gradlew
          echo "Android project ditemukan."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          yes | sdkmanager --licenses || true

      - name: Check project prerequisites
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Python:"
          python --version

          echo "Gradle:"
          cd android
          ./gradlew --version

          echo "Generated Android sources:"
          if [ -d app/generated-android ]; then
            find app/generated-android -maxdepth 2 -type f | head -50
          else
            echo "Generated game sources are absent."
            echo "The APK may contain only the Vulkan test."
          fi


      - name: Build APK
        shell: bash
        run: |
          cd android

          set +e
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "========== GRADLE ERROR SUMMARY =========="
            grep -n -B 5 -A 12 -E \
              "What went wrong:|Caused by:|Could not|No such file|failed|error:" \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -120 || true

            exit "$RESULT"
          fi


      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-apk

          find android -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp --parents {} release-apk/ \;

          if ! find release-apk -type f -name "*.apk" | grep -q .; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi

          find release-apk -type f -name "*.apk" -ls

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Android-APK
          path: release-apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
