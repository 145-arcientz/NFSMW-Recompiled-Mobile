# nfsmw.toml - settings of NFSMW Android Evolved.
#
# Built from the tuned Switch release settings (nfsmw-nx-installer, release/nfsmw.toml): the native renderer
# instead of the emulated Xenos GPU, and every cost reduction measured on the console. Removed: the Switch-only
# keys (clocks, SaltyNX, nvmap, the NVK/Mesa patches, core pinning of Horizon) and the diagnostics.
#
# GameActivity copies it from the APK to files/nfsmw/user/nfsmw.toml. If you edit that copy, a new APK keeps
# your version; delete it to get the new defaults.

# The code only turns these on for the Switch (REX_PLATFORM_SWITCH); a phone needs them just as much.
nfsmw_render_sin_mosaico = true      # draw the scene once: no 3-strip tiling, no MSAA
nfsmw_cubemap_caras_siempre = 4      # the rear-view mirror face of the car cubemap, every frame

# 1280x720 is what the Switch draws in handheld mode (30 FPS there). A recent phone GPU can take
# "1920x1080": change it here or in the settings menu (it needs a restart).
nfsmw_resolucion_interna = "1280x720"

# Diagnostics off: they only write to the log.
present_perfil_pintado = false
nfsmw_streaming_diag = false

